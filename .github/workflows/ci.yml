name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: no external dependencies to install
        run: node -e "const p=require('./package.json'); if(Object.keys(p.dependencies||{}).length) { console.error('unexpected runtime dependencies'); process.exit(1) }"
      - name: unit tests
        run: node --test "test/*.test.mjs"
      - name: guard against committed session data
        run: node scripts/guard-no-sessions.mjs
